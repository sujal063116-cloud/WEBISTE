<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PureHome — Interactive Preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
:root{--ink:#17352d;--green:#285b4d;--mint:#dfeee6;--cream:#f7f5ef;--muted:#68766f}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);background:#fbfaf7}button,input{font:inherit}button,a{cursor:pointer}a{text-decoration:none;color:inherit}.nav{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:#fbfaf7;border-bottom:1px solid #e9e6de;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:22px}.mark{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:var(--green);color:white}.navlinks{display:flex;gap:24px;align-items:center;font-size:14px}.navlinks button,.navlinks a{border:0;background:none}.cart{background:var(--ink)!important;color:white!important;padding:11px 16px;border-radius:24px}.menu{display:none;border:0;background:none;font-size:22px}.hero{min-height:600px;background:var(--mint);display:grid;grid-template-columns:1fr 1fr;padding:70px 8%;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#6a806f}.hero h1,.shop h1,.detail h1,.cart h1,.auth h1{font-size:clamp(48px,6vw,78px);line-height:.98;letter-spacing:-3px;margin:20px 0}.hero h1 i,h2 i,.detail h1 i{font-family:'Playfair Display',serif}.hero p{max-width:520px;font-size:17px;line-height:1.7;color:#52655d}.actions{display:flex;gap:20px;margin:30px 0}.primary{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--ink);color:white;padding:14px 22px;border:0;border-radius:30px;font-weight:700}.secondary{border:0;background:none;font-weight:700;padding:10px 0;border-bottom:1px solid}.trust{display:flex;gap:38px;margin-top:40px}.trust b,.trust span{display:block}.trust b{font-size:19px}.trust span{font-size:11px;color:#63746c;margin-top:5px}.visual{position:relative;display:grid;place-items:center}.sun{position:absolute;width:390px;height:390px;border-radius:50%;background:#f1d6a2}.bottle{z-index:2;position:relative;width:195px;height:350px;background:linear-gradient(90deg,#e4e2d8,#fff,#d8d5cb);border-radius:35px;transform:rotate(5deg);box-shadow:25px 30px 45px #45645635}.cap{position:absolute;top:-32px;left:53px;width:88px;height:43px;background:#20483d;border-radius:9px 9px 4px 4px}.label{position:absolute;left:17px;right:17px;top:98px;height:165px;background:#f5f0e4;border:1px solid #d9d0bc;display:grid;place-items:center;text-align:center}.label b{font-size:24px;display:block;letter-spacing:2px}.label small,.label span{display:block;font-size:9px;letter-spacing:2px}.note{position:absolute;right:2%;bottom:35px;background:#fff;padding:14px 18px;border-radius:13px;box-shadow:0 12px 30px #45645620;font-size:12px}.strip{display:grid;grid-template-columns:repeat(4,1fr);padding:20px 8%;background:#fff;border-bottom:1px solid #eeeae1}.strip div{text-align:center;font-size:12px;font-weight:700}.section{padding:85px 8%}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:40px}.head h2{font-size:47px;line-height:1.05;letter-spacing:-2px;margin:15px 0}.head p{max-width:390px;color:var(--muted);line-height:1.7}.benefits,.products{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.benefit,.card{background:#fff;border:1px solid #e2dfd6;border-radius:18px;overflow:hidden}.benefit{padding:30px}.icon{width:48px;height:48px;border-radius:15px;background:var(--mint);display:grid;place-items:center}.benefit p,.card p{color:var(--muted);line-height:1.6;font-size:14px}.cream{background:var(--cream)}.pic{height:280px;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;top:15px;left:15px;background:white;padding:7px 10px;border-radius:20px;font-size:10px;font-weight:700}.info{padding:20px}.rating{font-size:12px;color:#ad7d2c;font-weight:700}.card h3{font-size:18px;margin:10px 0 7px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.add{width:40px;height:40px;border:0;border-radius:50%;background:var(--ink);color:white;font-size:22px}.about{display:grid;grid-template-columns:1fr 1fr;background:#e8efe9}.about img{width:100%;height:100%;min-height:500px;object-fit:cover}.aboutText{padding:75px 12%;display:flex;flex-direction:column;justify-content:center}.aboutText h2{font-size:48px;line-height:1.05;letter-spacing:-2px}.aboutText p{line-height:1.7;color:var(--muted)}.cta{text-align:center;padding:90px 20px;background:var(--green);color:white}.cta h2{font-size:50px}.light{background:white;color:var(--ink)}footer{background:#15332b;color:#d9e4df;display:grid;grid-template-columns:1.5fr 1fr 1fr 1.5fr;gap:35px;padding:55px 8%;font-size:12px}footer a{display:block;color:#aabdb4;margin:8px 0}.newsletter{display:flex;background:#fff;border-radius:25px;padding:4px}.newsletter input{border:0;outline:0;padding:8px;width:100%}.newsletter button{border:0;border-radius:50%;background:var(--ink);color:white;width:36px;height:36px}.shop,.detail,.cart,.auth{padding:70px 8%}.shopTop{display:flex;justify-content:space-between;align-items:end}.shopTop p{max-width:390px;color:var(--muted);line-height:1.7}.tools{display:flex;gap:20px;align-items:center;margin:40px 0}.search{display:flex;gap:8px;align-items:center;border:1px solid #ddd9d0;background:#fff;border-radius:25px;padding:11px 15px;width:280px}.search input{border:0;outline:0;width:100%}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{border:1px solid #d9d7cf;background:transparent;border-radius:20px;padding:9px 13px}.chips .active{background:var(--ink);color:#fff}.detail{display:grid;grid-template-columns:1fr 1fr;background:#eef2ed;min-height:620px}.detailImage img{width:100%;height:100%;min-height:620px;object-fit:cover}.detailCopy{padding:90px 12%;align-self:center}.detailCopy h1{font-size:55px}.price{font-size:28px;font-weight:700;margin:20px 0}.detailCopy p{color:var(--muted);line-height:1.7}.detailCopy ul{list-style:none;padding:0;line-height:2}.cartLayout{display:grid;grid-template-columns:1.5fr .7fr;gap:60px}.cartRow{display:grid;grid-template-columns:95px 1fr auto auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid #ddd9d0}.cartRow img{width:95px;height:95px;object-fit:cover;border-radius:13px}.qty{display:flex;gap:10px;align-items:center;margin-top:12px}.qty button{border:1px solid #ddd9d0;background:#fff;border-radius:50%;width:28px;height:28px}.trash{border:0;background:none}.summary{background:#f0ece2;padding:28px;border-radius:18px;height:max-content;position:sticky;top:100px}.summary>div{display:flex;justify-content:space-between;padding:9px 0;font-size:13px}.full{width:100%;margin-top:18px}.empty{text-align:center;padding:130px 20px}.auth{min-height:65vh;background:var(--mint);display:grid;place-items:center}.authCard{background:white;border:1px solid #ddd9d0;border-radius:20px;padding:42px;max-width:450px;width:100%}.authCard input{display:block;width:100%;margin:12px 0;padding:13px;border:1px solid #d9d7cf;border-radius:10px}.error{background:#fff0ef;color:#a34b45;padding:10px;border-radius:8px;font-size:13px}.modal{position:fixed;inset:0;background:#17352dcc;display:grid;place-items:center;z-index:50}.modalBox{background:#fff;padding:42px;border-radius:20px;text-align:center;max-width:420px}.toast{position:fixed;right:25px;bottom:25px;background:#17352d;color:#fff;padding:14px 18px;border-radius:12px;z-index:60;box-shadow:0 10px 30px #0003}@media(max-width:850px){.navlinks{display:none}.menu{display:block}.hero,.about,.detail{grid-template-columns:1fr}.visual{order:-1;min-height:330px}.strip{grid-template-columns:1fr 1fr;gap:15px}.benefits,.products{grid-template-columns:1fr}.head,.shopTop{display:block}.tools{flex-direction:column;align-items:flex-start}.cartLayout{grid-template-columns:1fr}.detailImage img{min-height:400px}.aboutText{padding:60px 8%}footer{grid-template-columns:1fr 1fr}}@media(max-width:550px){.hero h1,.shop h1,.detail h1,.cart h1,.auth h1{font-size:44px}.hero{padding:50px 7%}.trust{gap:15px;flex-wrap:wrap}.strip{grid-template-columns:1fr}.section{padding:60px 7%}.cartRow{grid-template-columns:70px 1fr auto}.cartRow img{width:70px;height:70px}.cartRow>strong{grid-column:2}.aboutText h2,.head h2{font-size:38px}.cta h2{font-size:40px}footer{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const products=[
{id:1,name:"PureHome All-Purpose Cleaner",price:12.99,cat:"Surface Care",desc:"Plant-based everyday cleaner for kitchens, counters and sealed surfaces.",img:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?auto=format&fit=crop&w=900&q=80",tag:"Bestseller"},
{id:2,name:"Crystal Glass Spray",price:9.99,cat:"Glass Care",desc:"Streak-free formula that leaves mirrors and windows crystal clear.",img:"https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?auto=format&fit=crop&w=900&q=80",tag:"Bestseller"},
{id:3,name:"FreshGuard Disinfectant",price:15.99,cat:"Disinfecting",desc:"Powerful everyday disinfectant spray with a clean, fresh finish.",img:"https://images.unsplash.com/photo-1585832770485-e68a5dbfad52?auto=format&fit=crop&w=900&q=80",tag:"Bestseller"},
{id:4,name:"Laundry Soft Wash",price:18.49,cat:"Laundry",desc:"Gentle concentrated laundry wash designed for everyday loads.",img:"https://images.unsplash.com/photo-1604335399105-a0c585fd81a1?auto=format&fit=crop&w=900&q=80",tag:"Essential"},
{id:5,name:"Kitchen Degreaser",price:11.49,cat:"Kitchen",desc:"Cuts through stubborn grease and cooking residue fast.",img:"https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=900&q=80",tag:"Essential"},
{id:6,name:"Bathroom Foam Cleaner",price:13.49,cat:"Bathroom",desc:"Foaming cleaner for sinks, tubs, tiles and bathroom fixtures.",img:"https://images.unsplash.com/photo-1584622781867-2e6a8f6b3b52?auto=format&fit=crop&w=900&q=80",tag:"Essential"}];
let cart=JSON.parse(localStorage.getItem("preview_cart")||"[]"),user=JSON.parse(localStorage.getItem("preview_user")||"null"),toastTimer;
function save(){localStorage.setItem("preview_cart",JSON.stringify(cart));localStorage.setItem("preview_user",JSON.stringify(user))}
function toast(t){clearTimeout(toastTimer);let x=document.querySelector(".toast");if(!x){x=document.createElement("div");x.className="toast";document.body.appendChild(x)}x.textContent=t;x.style.display="block";toastTimer=setTimeout(()=>x.style.display="none",2200)}
function header(){return `<header class="nav"><a class="brand" href="#" onclick="home();return false"><span class="mark">✦</span>Pure<span style="font-weight:400">Home</span></a><nav class="navlinks"><button onclick="shop()">Shop</button><button onclick="document.getElementById('why').scrollIntoView()">Why PureHome</button><button onclick="document.getElementById('about').scrollIntoView()">About</button>${user?`<button onclick="logout()">Logout</button><button onclick="orders()">Orders</button>`:`<button onclick="auth('login')">Login</button>`}<button class="cart" onclick="cartPage()">🛍 Cart ${cart.reduce((a,x)=>a+x.q,0)}</button></nav><button class="menu" onclick="mobileMenu()">☰</button></header>`}
function layout(content){document.getElementById("app").innerHTML=header()+content+`<footer><div><div class="brand" style="color:white"><span class="mark">✦</span>PureHome</div><p>Better cleaning for a cleaner home.</p></div><div><b>Shop</b><a onclick="shop()">All products</a><a onclick="shop('Kitchen')">Kitchen</a><a onclick="shop('Bathroom')">Bathroom</a></div><div><b>Company</b><a onclick="document.getElementById('about')?.scrollIntoView()">About us</a><a onclick="document.getElementById('why')?.scrollIntoView()">Our promise</a></div><div><b>Newsletter</b><p>Get practical cleaning tips and offers.</p><div class="newsletter"><input placeholder="Your email"><button onclick="toast('Thanks for subscribing!')">→</button></div></div></footer><div class="toast" style="display:none"></div>`}
function home(){layout(`<section class="hero"><div><span class="eyebrow">✦ CLEANING, REIMAGINED</span><h1>A cleaner home.<br><i>Less effort.</i></h1><p>High-performance cleaning essentials made with thoughtful ingredients, beautiful design and your everyday routine in mind.</p><div class="actions"><button class="primary" onclick="shop()">Shop essentials →</button><button class="secondary" onclick="document.getElementById('why').scrollIntoView()">Why PureHome?</button></div><div class="trust"><div><b>4.9/5</b><span>Customer rating</span></div><div><b>30k+</b><span>Happy homes</span></div><div><b>Free</b><span>Shipping over $50</span></div></div></div><div class="visual"><div class="sun"></div><div class="bottle"><div class="cap"></div><div class="label"><small>PURE</small><b>HOME</b><span>ALL-PURPOSE<br>CLEANER</span></div></div><div class="note">Plant-based<br><b>clean power</b></div></div></section><div class="strip"><div>🚚 Free shipping on $50+</div><div>🛡 Secure checkout</div><div>✦ Thoughtful formulas</div><div>✓ 30-day guarantee</div></div><section class="section" id="why"><div class="head"><div><span class="eyebrow">THE PUREHOME PROMISE</span><h2>Good for your home.<br><i>Better for your routine.</i></h2></div><p>Cleaning products should work beautifully, look good on your shelf and make everyday chores feel a little lighter.</p></div><div class="benefits"><div class="benefit"><div class="icon">✦</div><h3>Powerful formulas</h3><p>Effective everyday performance without the harsh, overwhelming feel.</p></div><div class="benefit"><div class="icon">🛡</div><h3>Thoughtfully made</h3><p>Simple ingredients and clear product information you can feel good about.</p></div><div class="benefit"><div class="icon">🚚</div><h3>Easy delivery</h3><p>Reliable doorstep delivery with free shipping when your basket reaches $50.</p></div></div></section><section class="section cream" id="shop"><div class="head"><div><span class="eyebrow">CUSTOMER FAVORITES</span><h2>Start with the <i>essentials.</i></h2></div><button class="secondary" onclick="shop()">View all products →</button></div><div class="products">${products.slice(0,3).map(card).join("")}</div></section><section class="about" id="about"><div><img src="https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=1200&q=85"></div><div class="aboutText"><span class="eyebrow">MADE FOR REAL LIFE</span><h2>Cleaning shouldn't take over your day.</h2><p>PureHome brings together practical products that help you get more done with less fuss. From the kitchen counter to the bathroom mirror, our collection is built around the places you actually clean.</p><button class="primary" onclick="shop()">Explore the collection →</button></div></section><section class="cta"><span class="eyebrow" style="color:#cfe0d6">READY WHEN YOU ARE</span><h2>Make room for a cleaner routine.</h2><p>Stock up on the products you'll actually reach for.</p><button class="primary light" onclick="shop()">Shop PureHome →</button></section>`)}
function card(p){return `<div class="card"><div class="pic"><img src="${p.img}"><span class="tag">${p.tag}</span></div><div class="info"><div class="rating">★ 4.9 · 120+ reviews</div><h3>${p.name}</h3><p>${p.desc}</p><div class="bottom"><b>$${p.price.toFixed(2)}</b><button class="add" onclick="add(${p.id})">+</button></div><button class="secondary" onclick="detail(${p.id})">View product →</button></div></div>`}
function shop(cat="All"){let q="";layout(`<main class="shop"><div class="shopTop"><div><span class="eyebrow">THE COLLECTION</span><h1>Everyday cleaning,<br><i>made better.</i></h1></div><p>Simple, effective essentials for the rooms and routines that matter most.</p></div><div class="tools"><div class="search">⌕ <input id="q" placeholder="Search products" oninput="filterShop('${cat}')"></div><div class="chips">${["All","Surface Care","Glass Care","Disinfecting","Laundry","Kitchen","Bathroom"].map(c=>`<button class="${cat===c?'active':''}" onclick="shop('${c}')">${c}</button>`).join("")}</div></div><div class="products" id="grid"></div></main>`);filterShop(cat)}
function filterShop(cat){let q=(document.getElementById("q")?.value||"").toLowerCase();let list=products.filter(p=>(cat==="All"||p.cat===cat)&&(p.name+p.desc).toLowerCase().includes(q));document.getElementById("grid").innerHTML=list.map(card).join("")||"<p>No products found.</p>"}
function detail(id){let p=products.find(x=>x.id===id);layout(`<main class="detail"><div class="detailImage"><img src="${p.img}"></div><div class="detailCopy"><div class="rating">★ 4.9 · 120+ reviews</div><span class="eyebrow">${p.cat.toUpperCase()}</span><h1>${p.name}</h1><div class="price">$${p.price.toFixed(2)}</div><p>${p.desc}</p><ul><li>✓ Effective everyday formula</li><li>✓ Easy to use and store</li><li>✓ Free shipping over $50</li></ul><button class="primary" onclick="add(${p.id})">Add to cart 🛍</button></div></main>`)}
function add(id){let p=products.find(x=>x.id===id),x=cart.find(i=>i.id===id);x?x.q++:cart.push({id,q:1});save();toast(p.name+" added to cart");setTimeout(()=>{if(document.querySelector(".nav")){document.querySelector(".nav").outerHTML=header()}},0)}
function cartPage(){let total=cart.reduce((a,i)=>a+products.find(p=>p.id===i.id).price*i.q,0);layout(`<main class="cart"><span class="eyebrow">YOUR BAG</span><h1>Ready to check <i>out?</i></h1>${cart.length?`<div class="cartLayout"><div>${cart.map(i=>{let p=products.find(x=>x.id===i.id);return `<div class="cartRow"><img src="${p.img}"><div><h3>${p.name}</h3><p>$${p.price.toFixed(2)}</p><div class="qty"><button onclick="change(${p.id},-1)">−</button><b>${i.q}</b><button onclick="change(${p.id},1)">+</button></div></div><strong>$${(p.price*i.q).toFixed(2)}</strong><button class="trash" onclick="removeItem(${p.id})">🗑</button></div>`}).join("")}</div><aside class="summary"><h2>Order summary</h2><div><span>Subtotal</span><b>$${total.toFixed(2)}</b></div><div><span>Shipping</span><b>${total>=50?"Free":"$5.00"}</b></div><hr><div><span>Total</span><b>$${(total+(total>=50?0:5)).toFixed(2)}</b></div><button class="primary full" onclick="checkout()">Checkout →</button></aside></div>`:`<div class="empty"><h2>Your cart is empty.</h2><button class="primary" onclick="shop()">Browse products</button></div>`}</main>`)}
function change(id,n){let x=cart.find(i=>i.id===id);if(x)x.q=Math.max(1,x.q+n);save();cartPage()}
function removeItem(id){cart=cart.filter(i=>i.id!==id);save();cartPage();toast("Item removed")}
function auth(mode){layout(`<main class="auth"><div class="authCard"><span class="eyebrow">${mode==="login"?"WELCOME BACK":"START FRESH"}</span><h1>${mode==="login"?"Welcome back.":"Create your account."}</h1><p>${mode==="login"?"Sign in to view your orders and check out faster.":"Join PureHome and make your next clean a little easier."}</p><form onsubmit="submitAuth(event,'${mode}')">${mode==="register"?'<input id="name" placeholder="Full name" required>':""}<input id="email" type="email" placeholder="Email address" required><input id="pass" type="password" minlength="6" placeholder="Password" required><div id="authError"></div><button class="primary full">${mode==="login"?"Sign in":"Create account"} →</button></form><p style="text-align:center">${mode==="login"?"New to PureHome?":"Already have an account?"} <button class="secondary" onclick="auth('${mode==="login"?"register":"login"}')">${mode==="login"?"Create an account":"Sign in"}</button></p></div></main>`)}
function submitAuth(e,mode){e.preventDefault();let email=document.getElementById("email").value,pass=document.getElementById("pass").value,name=document.getElementById("name")?.value||"Demo Customer";if(mode==="login"&&(!user||user.email!==email||user.password!==pass)){document.getElementById("authError").innerHTML='<div class="error">Demo: register this email first.</div>';return}user={name,email,password:pass};save();toast(mode==="login"?"Signed in!":"Account created!");setTimeout(home,700)}
function logout(){user=null;save();home();toast("Signed out")}
function checkout(){if(!user){auth("login");return}let total=cart.reduce((a,i)=>a+products.find(p=>p.id===i.id).price*i.q,0);layout(`<main class="cart"><span class="eyebrow">SECURE CHECKOUT</span><h1>Finish your <i>order.</i></h1><div class="cartLayout"><div class="authCard"><h3>Shipping details</h3><input style="width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px" placeholder="Full name"><input style="width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px" placeholder="Street address"><input style="width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px" placeholder="City / Postal code"><h3>Payment</h3><div style="padding:15px;border:1px solid #ddd;border-radius:10px">Card ending in •••• 4242 <span style="float:right">Secure ✓</span></div><button class="primary full" onclick="placeOrder()">Place order · $${(total+(total>=50?0:5)).toFixed(2)}</button></div><aside class="summary"><h2>Summary</h2><div><span>Items</span><b>${cart.reduce((a,i)=>a+i.q,0)}</b></div><div><span>Subtotal</span><b>$${total.toFixed(2)}</b></div><div><span>Shipping</span><b>${total>=50?"Free":"$5.00"}</b></div><hr><div><span>Total</span><b>$${(total+(total>=50?0:5)).toFixed(2)}</b></div></aside></div></main>`)}
function placeOrder(){cart=[];save();document.body.insertAdjacentHTML("beforeend",`<div class="modal"><div class="modalBox"><h2>✓ Order received!</h2><p>Thanks, ${user.name}. Your demo order has been placed.</p><button class="primary" onclick="this.closest('.modal').remove();home()">Back home</button></div></div>`);}
function orders(){layout(`<main class="shop"><span class="eyebrow">YOUR ACCOUNT</span><h1>Your <i>orders.</i></h1><div class="benefit"><h3>Demo order history</h3><p>Your real orders will appear here when the backend is connected. The preview checkout is fully interactive and stores cart/account state in your browser.</p></div></main>`)}
function mobileMenu(){toast("Use the desktop preview for the full navigation demo")}
home();
</script>

<style>
#previewBar{position:fixed;left:14px;right:14px;bottom:14px;z-index:9999;background:#17352d;color:#fff;padding:10px 14px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 12px Arial;box-shadow:0 12px 30px #0003}
#previewBar button{border:0;border-radius:20px;padding:8px 13px;background:#fff;color:#17352d;font-weight:700;cursor:pointer}
</style>
<div id="previewBar"><span>PureHome interactive preview</span><button onclick="localStorage.removeItem('preview_cart');localStorage.removeItem('preview_user');location.reload()">Reset demo</button></div>
</body>
</html>
